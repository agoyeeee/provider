services:
  # Laravel Application
  app:
    image: ghcr.io/agoyeeee/provider:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: provider-app
    restart: unless-stopped
    network_mode: host
    environment:
      - APP_NAME=${APP_NAME:-Provider}
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8082}
      - APP_LOCALE=${APP_LOCALE:-en}
      - APP_FALLBACK_LOCALE=${APP_FALLBACK_LOCALE:-en}
      - DB_CONNECTION=mysql
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-provider}
      - DB_USERNAME=${DB_USERNAME:-ronaltama}
      - DB_PASSWORD=${DB_PASSWORD:-ronaltama}
      - CACHE_STORE=${CACHE_STORE:-database}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - SESSION_LIFETIME=${SESSION_LIFETIME:-120}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - LOG_CHANNEL=${LOG_CHANNEL:-stack}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    volumes:
      - ./.env:/var/www/html/.env
      - app-storage:/var/www/html/storage/app

volumes:
  app-storage:
    driver: local
